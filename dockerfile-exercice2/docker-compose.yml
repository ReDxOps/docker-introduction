services:
  quiz-docker:
    image: quiz-docker:secure
    build: .
    container_name: quiz-docker
    restart: unless-stopped
    ports:
      - 8082:8080
    security_opt: 
      - no-new-privileges:true
    cap_drop: ["ALL"]
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          cpus: 0.25
          memory: 48M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3